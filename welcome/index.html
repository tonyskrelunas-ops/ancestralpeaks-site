<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The welcome · Ancestral Peaks</title>
<meta name="description" content="Three minutes on what is inside Ancestral Peaks, how the app works, and what it does for you.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../favicon.ico">
<style>
  /* The welcome film on its own page: nothing else runs here, so a phone has all its memory for the film. */
  html,body{margin:0;height:100%;background:#000;color:#f4efe4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain;background:#000}
  .back{position:fixed;left:14px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3;color:#f4efe4;text-decoration:none;font-size:15px;
        background:rgba(20,17,13,.6);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:.5em .95em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .go{position:fixed;inset:0;z-index:2;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
  .go span{width:92px;height:92px;border-radius:50%;background:rgba(20,17,13,.55);border:1px solid rgba(255,255,255,.6);display:grid;place-items:center}
  .go svg{width:34px;height:34px;fill:#fff;margin-left:5px}
  .go[hidden]{display:none}
  .note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);text-align:center;font-size:12px;color:rgba(244,239,228,.6);padding:0 16px;z-index:1;pointer-events:none}
  .playing .note{display:none}
</style>
</head>
<body>
<a class="back" href="../">← Ancestral Peaks</a>
<div class="wrap"><video id="v" playsinline controls preload="metadata"></video></div>
<button class="go" id="go" type="button" aria-label="Play the welcome film, three minutes"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>
<p class="note">The far messengers of other peoples in this film are drawn with AI. The water, the land and the app are our own.</p>
<script>
(function(){
  var wide = window.matchMedia('(min-width: 900px) and (orientation: landscape)').matches;
  var v = document.getElementById('v'), go = document.getElementById('go');
  v.poster = wide ? '../media/welcome/welcome-poster-1920x1080.jpg' : '../media/welcome/welcome-poster-720x1280.jpg?v=2';
  v.src = wide ? '../media/welcome/welcome-film-1920x1080.mp4' : '../media/welcome/welcome-film-720x1280.mp4';
  function start(){ go.hidden = true; document.body.classList.add('playing'); var p = v.play(); if (p && p.catch) p.catch(function(){ go.hidden = false; }); }
  go.addEventListener('click', start);
  v.addEventListener('play', function(){ go.hidden = true; document.body.classList.add('playing'); });
  if (/[?&]play\b/.test(location.search)) { var p = v.play(); if (p && p.then) p.then(function(){ go.hidden = true; document.body.classList.add('playing'); }).catch(function(){}); }
})();
</script>
</body>
</html>
