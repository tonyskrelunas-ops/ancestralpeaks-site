<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ancestral Peaks</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b09">
<link rel="icon" href="../favicon.ico">
<style>
  /* 11/26: one film on its own quiet page, for phones (the home runs several loops; a film on top of them closed the
     app before). The film streams in top quality from Hostinger, with the earlier copy as the fallback. */
  :root{--ink:#f4efe4;--soft:rgba(244,239,228,.78)}
  *{box-sizing:border-box}
  html,body{margin:0;background:#0d0b09;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
  body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,30px);
       padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 22px);
       background:radial-gradient(120% 70% at 50% 0%,#2a2117 0%,#0d0b09 62%)}
  .brand{display:inline-flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none}
  .brand svg{width:40px;height:40px}.brand b{font-size:clamp(1.4rem,6vw,2rem);font-weight:800}
  h1{margin:0;font-size:clamp(1.3rem,5.6vw,2rem);font-weight:800;text-align:center}
  .stage{position:relative;width:min(100%,1100px);aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 26px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08)}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  .go{position:absolute;inset:0;z-index:2;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
  .go span{width:78px;height:78px;border-radius:50%;background:rgba(20,17,13,.55);border:1px solid rgba(255,255,255,.65);display:grid;place-items:center}
  .go svg{width:30px;height:30px;fill:#fff;margin-left:5px}.go[hidden]{display:none}
  .back{color:var(--soft);text-decoration:none;font-size:1rem}
</style>
</head>
<body>
<a class="brand" href="../" aria-label="Ancestral Peaks"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M3 31 L15 11 L22 22 L27 15 L37 31 Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><ellipse cx="20" cy="34.5" rx="6" ry="2.3" fill="currentColor" opacity=".9"/></svg><b>Ancestral Peaks</b></a>
<h1 id="t"></h1>
<div class="stage">
  <video id="v" playsinline preload="metadata"></video>
  <button class="go" id="go" type="button" aria-label="Play"><span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span></button>
</div>
<a class="back" href="../" id="back">← Ancestral Peaks</a>
<script src="../js/peaks-hq.js?v=1126r"></script>
<script>
(function(){
  var P = 'https://members.ancestralpeaks.com/p/films/';
  var FILMS = {
    'lt-akmens-kvepavimas': { t: 'Akmens kvėpavimas', mp4: '/media/lt/akmens-kvepavimas-1280x720.mp4', lang: 'lt' },
    'lt-rasa': { t: 'Rasa', mp4: '/media/lt/rasa-1280x720.mp4', lang: 'lt' },
    'lt-ka-zino-lietuva': { t: 'Ką žino Lietuva', mp4: '/media/lt/ka-zino-lietuva-1280x720.mp4', lang: 'lt' }
  };
  var q = new URLSearchParams(location.search), id = q.get('f'), f = FILMS[id];
  if (!f) { location.replace('../'); return; }
  document.documentElement.lang = f.lang; document.title = f.t + ' · Ancestral Peaks';
  document.getElementById('t').textContent = f.t;
  var v = document.getElementById('v'), go = document.getElementById('go');
  v.poster = P + id + '/poster-1920.webp';
  var ready = window.APHQ ? APHQ.attach(v, P + id + '/master.m3u8', f.mp4) : (v.src = f.mp4, Promise.resolve());
  function playing(){ go.hidden = true; v.controls = true; }
  go.addEventListener('click', function(){ playing(); ready.then(function(){ var p = v.play(); if (p && p.catch) p.catch(function(){ go.hidden = false; }); }); });
  v.addEventListener('play', playing);
  if (q.has('play')) ready.then(function(){ var p = v.play(); if (p && p.then) p.then(playing).catch(function(){}); });
})();
</script>
</body>
</html>
