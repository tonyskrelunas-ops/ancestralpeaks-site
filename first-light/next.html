<style>
.fl{background:#f3efe7;color:#1f2219;min-height:100vh;padding:clamp(96px,14vh,140px) 16px 72px}
.fl-in{max-width:640px;margin:0 auto}
.fl .label{font:600 .74rem/1.2 var(--text,Arial,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#9a6b22;margin:0 0 .6rem}
.fl h1{font:600 clamp(2rem,5.5vw,3.1rem)/1.08 var(--display,Georgia,serif);margin:0 0 .4rem;color:#1f2219}
.fl .date{font:400 1rem/1.4 var(--text,Arial,sans-serif);color:#5b5e52;margin:0 0 1.6rem}
.fl audio{width:100%;margin:0 0 1.8rem}
.fl .words p{font:400 1.12rem/1.7 Georgia,'Times New Roman',serif;margin:0 0 1.05rem}
.fl .more{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid #e1d9c8}
.fl .more h2{font:600 .74rem/1.2 var(--text,Arial,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#9a6b22;margin:0 0 .8rem}
.fl .more a{display:block;color:#1f3a33;text-decoration:none;padding:.5rem 0;border-bottom:1px solid #ece5d6;font:400 1.02rem/1.4 Georgia,serif}
.fl .more a span{color:#7a7a70;font:400 .86rem/1.4 var(--text,Arial,sans-serif);margin-left:.4rem}
.fl .join{margin-top:2.2rem;padding:1.3rem 1.4rem;background:#fff;border:1px solid #e4ddcf;border-radius:10px;font:400 1rem/1.6 var(--text,Arial,sans-serif)}
.fl .join a{color:#1f3a33;font-weight:600}
/* Tony 11/15: "if they click it goes further in the app": after the morning's audio, one door onward */
.fl .next{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:-.6rem 0 1.9rem;padding:1.05rem 1.3rem;background:#1f3a33;color:#f7f2e8;
  border-radius:14px;text-decoration:none;transition:transform .5s ease,box-shadow .5s ease}
.fl .next b{display:block;font:400 1.14rem/1.3 Georgia,serif;color:#f7f2e8}
.fl .next small{display:block;margin-top:.2rem;font:400 .84rem/1.35 var(--text,Arial,sans-serif);color:#cfd6cc;letter-spacing:.02em}

<script>try{sessionStorage.setItem("ap.founding.peek","1")}catch(e){}</script>   <!-- review copy: the founding season shows, so it can be looked at before November 27 -->

<body>
<header data-ap-nav data-active="/first-light/"></header>
<main class="fl"><div class="fl-in">
  <p class="label">First Light</p>
  <h1 id="flTitle">This morning</h1>
  <p class="date" id="flDate"></p>
  <audio id="flAudio" controls preload="metadata" playsinline></audio>
  <a class="next" id="flNext" href="/practice/#breath" hidden><span><b id="flNextL"></b><small id="flNextS"></small></span><span class="go" aria-hidden="true">&rarr;</span></a>
  <div class="words" id="flWords"></div>
  <div class="join">First Light comes to everyone on the list as a gift through December 11. After that it continues each weekday for Ancestral Peaks members, and comes each Monday to everyone else. <a href="/listen/">Visit the Listening Room &rarr;</a></div>
  <div class="more" id="flMore" hidden><h2>Earlier mornings</h2><div id="flList"></div></div>
</div></main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var az = new Date(Date.now() - 7*3600*1000).toISOString().slice(0,10);   // Arizona date (UTC-7, no daylight saving)
  fetch('days.json?v=' + az).then(function(r){ return r.json(); }).then(function(days){
    days = days.filter(function(d){ return d.date <= az; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var want = q.get('d'), day = days.find(function(d){ return d.date === want; }) || days[0];
    if (!day) { document.getElementById('flTitle').textContent = 'First Light begins Monday, November 16'; return; }
    var dt = new Date(day.date + 'T12:00:00');
    document.getElementById('flTitle').textContent = day.title;
    document.getElementById('flDate').textContent = dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + ' · ' + day.mins;
    var a = document.getElementById('flAudio'); a.src = '../media/first-light/' + day.date + '.m4a' + (day.v ? '?v=' + day.v : '');
    var nx = document.getElementById('flNext');
    if (day.next) { nx.href = day.next.href; document.getElementById('flNextL').textContent = day.next.label; document.getElementById('flNextS').textContent = day.next.sub || ''; nx.hidden = false;
      a.addEventListener('ended', function(){ nx.classList.add('lit'); try { nx.scrollIntoView({behavior:'smooth', block:'center'}); } catch(e){} }); }
    document.getElementById('flWords').innerHTML = day.text.split(/\n\s*\n/).map(function(p){ return '<p>' + p.replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</p>'; }).join('');
    var rest = days.filter(function(d){ return d !== day; });
    if (rest.length) { document.getElementById('flMore').hidden = false;
      document.getElementById('flList').innerHTML = rest.map(function(d){ return '<a href="?d=' + d.date + '">' + d.title + '<span>' + new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) + '</span></a>'; }).join(''); }
  }).catch(function(){});
})();
</script>
<script src="../shared/site.next.js?v=1125c" defer></script>
<script>
/* REVIEW COPY ONLY. Links to pages that have a review copy lead to that copy, so a visitor who is reviewing stays in the review. */
(function(){
  var M = ["/", "/begin/", "/books/", "/course/", "/films/", "/first-light/", "/founding/", "/gift/", "/listen/", "/mountain-within/", "/mountain-within/a-good-relationship-with-stress/", "/mountain-within/guide/", "/mountain-within/leaving-home/", "/mountain-within/the-hard-day/", "/play/", "/practice/", "/reader/", "/reading/", "/weeks/", "/why/", "/work/"];
  function fix(){
    var as = document.querySelectorAll('a[href]');
    for (var i = 0; i < as.length; i++) {
      var a = as[i], u; try { u = new URL(a.href); } catch (e) { continue; }
      if (u.origin !== location.origin) continue;
      var p = u.pathname.replace(/index\.html$/, '');
      if (M.indexOf(p) < 0) continue;
      a.href = p + 'next.html' + u.search + u.hash;
    }
  }
  fix();
  if (window.MutationObserver) { var t = 0; new MutationObserver(function(){ clearTimeout(t); t = setTimeout(fix, 60); }).observe(document.body, { childList: true, subtree: true }); }
  var c = document.createElement('div'); c.textContent = 'Review copy';
  c.style.cssText = 'position:fixed;z-index:57;left:10px;bottom:calc(' + (document.querySelector('.ap-thumb') ? '128px' : '12px') + ' + env(safe-area-inset-bottom,0px));padding:.25em .7em;border-radius:99px;background:rgba(16,11,13,.86);border:1px solid rgba(209,166,60,.8);color:#fff;font:700 11px/1.4 system-ui,sans-serif;pointer-events:none';
  document.body.appendChild(c);
})();
</script>
