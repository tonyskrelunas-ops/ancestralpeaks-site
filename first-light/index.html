<!doctype html>
<html lang="en" data-root="..">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Light · Ancestral Peaks</title>
<meta name="description" content="First Light: a minute or two every weekday morning to arrive, to ground, to give thanks, and to walk out into the day as a far messenger.">
<link rel="stylesheet" href="../shared/site.css?v=1110z">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#100B0D">
<link rel="apple-touch-icon" href="/app/apple-touch-icon.png">
<script src="/app/pwa.js?v=1108e" defer></script>
<link rel="canonical" href="https://ancestralpeaks.com/first-light/">
<style>
.fl{background:#f3efe7;color:#1f2219;min-height:100vh;padding:clamp(96px,14vh,140px) 16px 72px}
.fl-in{max-width:640px;margin:0 auto}
.fl .label{font:600 .74rem/1.2 var(--text,Arial,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#9a6b22;margin:0 0 .6rem}
.fl h1{font:600 clamp(2rem,5.5vw,3.1rem)/1.08 var(--display,Georgia,serif);margin:0 0 .4rem;color:#1f2219}
.fl .date{font:400 1rem/1.4 var(--text,Arial,sans-serif);color:#5b5e52;margin:0 0 1.6rem}
.fl audio{width:100%;margin:0 0 1.8rem}
.fl .words p{font:400 1.12rem/1.7 Georgia,'Times New Roman',serif;margin:0 0 1.05rem}
.fl .more{margin-top:2.6rem;padding-top:1.4rem;border-top:1px solid #e1d9c8}
.fl .more h2{font:600 .74rem/1.2 var(--text,Arial,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:#9a6b22;margin:0 0 .8rem}
.fl .more a{display:block;color:#1f3a33;text-decoration:none;padding:.5rem 0;border-bottom:1px solid #ece5d6;font:400 1.02rem/1.4 Georgia,serif}
.fl .more a span{color:#7a7a70;font:400 .86rem/1.4 var(--text,Arial,sans-serif);margin-left:.4rem}
.fl .join{margin-top:2.2rem;padding:1.3rem 1.4rem;background:#fff;border:1px solid #e4ddcf;border-radius:10px;font:400 1rem/1.6 var(--text,Arial,sans-serif)}
.fl .join a{color:#1f3a33;font-weight:600}
</style>
</head>
<body>
<header data-ap-nav data-active="/first-light/"></header>
<main class="fl"><div class="fl-in">
  <p class="label">First Light</p>
  <h1 id="flTitle">This morning</h1>
  <p class="date" id="flDate"></p>
  <audio id="flAudio" controls preload="metadata" playsinline></audio>
  <div class="words" id="flWords"></div>
  <div class="join">First Light comes to everyone on the list as a gift through December 11. After that it continues for Ancestral Peaks members. <a href="/listen/">Visit the Listening Room &rarr;</a></div>
  <div class="more" id="flMore" hidden><h2>Earlier mornings</h2><div id="flList"></div></div>
</div></main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var az = new Date(Date.now() - 7*3600*1000).toISOString().slice(0,10);   // Arizona date (UTC-7, no daylight saving)
  fetch('days.json?v=' + az).then(function(r){ return r.json(); }).then(function(days){
    days = days.filter(function(d){ return d.date <= az; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
    var want = q.get('d'), day = days.find(function(d){ return d.date === want; }) || days[0];
    if (!day) { document.getElementById('flTitle').textContent = 'First Light begins Monday, November 16'; return; }
    var dt = new Date(day.date + 'T12:00:00');
    document.getElementById('flTitle').textContent = day.title;
    document.getElementById('flDate').textContent = dt.toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric'}) + ' · ' + day.mins;
    var a = document.getElementById('flAudio'); a.src = '../media/first-light/' + day.date + '.m4a';
    document.getElementById('flWords').innerHTML = day.text.split(/\n\s*\n/).map(function(p){ return '<p>' + p.replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</p>'; }).join('');
    var rest = days.filter(function(d){ return d !== day; });
    if (rest.length) { document.getElementById('flMore').hidden = false;
      document.getElementById('flList').innerHTML = rest.map(function(d){ return '<a href="?d=' + d.date + '">' + d.title + '<span>' + new Date(d.date + 'T12:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'}) + '</span></a>'; }).join(''); }
  }).catch(function(){});
})();
</script>
<script src="../shared/site.js?v=1110z" defer></script>
</body>
</html>
